<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- 円形光彩 -->
  <circle cx="230" cy="256" r="140" fill="#3b82f6" opacity="0.25"/>
  
  <!-- タッチアイコン（人差し指） -->
  <text x="130" y="320" font-size="190" text-anchor="middle">👆</text>
  
  <!-- プラス記号 -->
  <g transform="translate(330, 240)">
    <circle cx="0" cy="0" r="85" fill="url(#plusGrad)" filter="drop-shadow(0 8px 20px rgba(245, 158, 11, 0.4))"/>
    <path d="M-40,0 L40,0 M0,-40 L0,40" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
